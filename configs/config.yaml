# ==========================================================================
# Konfigurasi Penelitian: Prediksi SST Laut Banda
# Model Hibrida LSTM-Transformer
# Pendekatan: MULTIVARIAT (SST + prediktor ERA5, F = 9)
#   Riwayat: awalnya dirancang univariate (F=1, hanya thetao), diubah ke
#   multivariate setelah data virtual mooring + ERA5 (u10,v10,t2m,d2m,sp,
#   wind_speed) tersedia lengkap & tervalidasi (QC lolos, 2014-2025).
# Single source of truth untuk seluruh pipeline.
# ==========================================================================

project:
  name: sst
  approach: multivariate   # univariate | multivariate
  random_seed: 42

# --------------------------------------------------------------------------
# Domain Spasial (Laut Banda)
# --------------------------------------------------------------------------
domain:
  lat_min: -9.0
  lat_max: -3.0
  lon_min: 123.0
  lon_max: 133.0
  buffer_lat_min: -9.5
  buffer_lat_max: -2.5
  buffer_lon_min: 122.5
  buffer_lon_max: 133.5
  depth_min: 0.49
  depth_max: 0.51

# --------------------------------------------------------------------------
# Sumber & Lokasi Data (SATU blok data: -- jangan diduplikasi)
# --------------------------------------------------------------------------
data:
  variables: [thetao]                                       # variabel yg didownload dari CMEMS (SST saja; prediktor multivariate berasal dari ERA5, bukan dari sini)
  reanalysis_dataset_id: cmems_mod_glo_phy_my_0.083deg_P1D-m
  analysis_dataset_id:   cmems_mod_glo_phy_anfc_0.083deg_P1D-m
  raw_dir: data/raw
  processed_dir: data/processed
  start_date: "2014-01-01"
  end_date: "2025-12-31"
  reanalysis_end: "2023-12-31"     # batas reanalysis; setelahnya pakai ANFC

  # --- Ditambahkan untuk tahap virtual mooring & windowing ---
  mooring_dir: data/processed/virtual_mooring   # output extract_virtual_mooring.py
  windowed_dir: data/processed/windowed         # output build_windows.py
  mooring_codes: ["01", "02", "03", "04", "05", "06"]
  target_col: sst
  # Kolom prediktor ERA5, dipakai karena project.approach: multivariate
  predictor_vars: [u10, v10, t2m, d2m, sp, wind_speed]
  # Tambahkan fitur temporal (doy_sin/doy_cos) saat multivariate -> F=9
  add_temporal_features_if_multivariate: true

# --------------------------------------------------------------------------
# Pembagian Data Temporal (kronologis, TANPA pengacakan)
# --------------------------------------------------------------------------
split:
  train: ["2014-01-01", "2022-12-31"]   # ~9 tahun, GLORYS
  val:   ["2023-01-01", "2023-12-31"]   # 1 tahun, GLORYS (homogen dgn train)
  test:  ["2024-01-01", "2025-12-31"]   # ANFC murni -> uji generalisasi OOD

# --------------------------------------------------------------------------
# Quality Control SST
# --------------------------------------------------------------------------
qc:
  sst_min: 20.0          # °C - batas fisik wajar Laut Banda
  sst_max: 35.0
  interpolate_gaps: true # interpolasi temporal untuk celah kecil
  max_gap_days: 3         # celah > ini TIDAK diinterpolasi, dibiarkan NaN lalu di-drop

# --------------------------------------------------------------------------
# Desain Eksperimen
#   REKONSILIASI horizon vs lookback:
#     - lookback_windows = panjang riwayat masukan (N)  -> 7 / 14 / 21 / 30 hari
#     - horizons         = horizon prediksi (h, t+h)    -> 1 / 3 / 7 / 14 hari
#   4 lookback x 4 horizon x 4 model = 64 eksperimen
# --------------------------------------------------------------------------
experiment:
  lookback_windows: [7, 14, 21, 30]
  horizons: [1, 3, 7, 14]
  # Hanya 3 model deep learning yang DIBANDINGKAN: 4 x 4 x 3 = 48 eksperimen.
  # Persistence TIDAK ada di sini (bukan model pembanding), tetapi tetap
  # dihitung otomatis di latar sebagai ACUAN Skill Score (penyebut SS).
  models: [lstm, transformer, hybrid]

# --------------------------------------------------------------------------
# Hyperparameter Model
# --------------------------------------------------------------------------
model:
  lstm:
    hidden_size: 50
    num_layers: 1
    dropout: 0.1
  transformer:
    d_model: 64
    nhead: 4
    num_layers: 2
    dim_feedforward: 128
    dropout: 0.1
  hybrid:
    lstm_hidden: 50
    proj_dim: 52           # 50 tidak habis dibagi 4 -> proyeksi linear 50->52
    nhead: 4               # 52 % 4 == 0
    num_transformer_layers: 2
    dim_feedforward: 128
    dropout: 0.1

# --------------------------------------------------------------------------
# Pelatihan
# --------------------------------------------------------------------------
training:
  device: cuda            # HPC (NVIDIA GPU via SLURM): cuda | cpu
  batch_size: 64
  batch_size_grid: 256
  max_epochs: 100
  learning_rate: 0.001
  early_stopping_patience: 10
  num_workers: 4
  pin_memory: true        # aktifkan utk cuda (mempercepat transfer host->GPU)

# --------------------------------------------------------------------------
# Evaluasi
# --------------------------------------------------------------------------
evaluation:
  primary_metric: skill_score
  skill_score_threshold: 0.3      # gate utama vs Persistence (Xu et al., 2023)
  metrics: [rmse, mae, r2, nse, skill_score]
  results_dir: results
  figures_dir: results/figures